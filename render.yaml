# render.yaml (opcional) — Solo define el Web Service que usa tu Dockerfile.
# El CRON lo sigues creando desde el panel.

services:
  - type: web
    name: lsa-saf-frp-bridge
    env: docker                 # usa el Dockerfile del repo
    dockerfilePath: ./Dockerfile
    plan: pro                   # ya que tu servicio está en PRO
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # Secrets (defínelos en el panel → Secrets; aquí solo referencias)
      - key: LSASAF_USER
        fromSecret: LSASAF_USER
      - key: LSASAF_PASS
        fromSecret: LSASAF_PASS
      - key: API_KEY
        fromSecret: BRIDGE_API_KEY

      # Config por defecto (puedes sobreescribirlas en el panel)
      - key: LAG_MIN
        value: "30"
      - key: FALLBACKS
        value: "8"
      - key: IBERIA_BBOX
        value: "-9.5,35.5,3.5,44.5"
      - key: HTTP_TIMEOUT
        value: "60"

# render.yaml (job de cron)
- type: cron
  name: reload-frp
  schedule: "2-59/5 * * * *"     # cada 5 min, desfasado
  command: |
    python - <<'PY'
    import os, urllib.request, sys
    KEY = os.environ.get("API_KEY", "")
    if not KEY:
      print("Falta API_KEY en env", file=sys.stderr); sys.exit(2)
    url = f"https://eumetsat-dyfr.onrender.com/reload?key={KEY}"
    with urllib.request.urlopen(url, timeout=30) as r:
        print(r.read().decode("utf-8"))
    PY
  envVars:
    - key: b15209343b99a7b0d28f0f0d2a697c0f
      sync: false

