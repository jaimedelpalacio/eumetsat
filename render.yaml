# render.yaml — REFERENCIA de la configuración real. No hay Blueprint enlazado:
# el servicio y el cron se gestionan desde el panel de Render.

services:
  - type: web
    name: eumetsat
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: starter
    numInstances: 1            # el estado vive en RAM: una sola instancia
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: LSASAF_USER
        sync: false
      - key: LSASAF_PASS
        sync: false
      - key: API_KEY
        sync: false

  - type: cron
    name: eumesatcron
    runtime: image
    image:
      url: docker.io/curlimages/curl:8.8.0
    region: frankfurt
    plan: starter
    schedule: "2-59/5 * * * *"
    dockerCommand: curl -fsS --max-time 300 -H X-API-Key:${API_KEY} https://eumetsat-dyfr.onrender.com/reload
    envVars:
      - key: API_KEY
        sync: false
